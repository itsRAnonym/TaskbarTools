name: Laporan bug
description: Ada yang tidak berjalan semestinya
body:
  - type: input
    id: windows
    attributes:
      label: Versi Windows
      description: Tekan Win+R, ketik winver
      placeholder: Windows 10 22H2 (build 19045)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versi NetSpeedTaskbar
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: icons
    attributes:
      label: Ukuran ikon taskbar
      options:
        - Besar (default)
        - Kecil (Use small taskbar buttons)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Apa yang terjadi?
      description: Sertakan screenshot taskbar kalau soal tampilan.
    validations:
      required: true
